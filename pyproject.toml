[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "inspect-replay"
version = "0.1.0"
description = "Deterministic, sample-aligned comparison of Inspect AI evaluation logs."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "inspect-replay contributors" }]
keywords = [
    "inspect-ai",
    "ai-evaluation",
    "evaluation",
    "regression-testing",
    "reproducibility",
    "ai-safety",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
# 0.3.180 is the oldest inspect_ai the full test suite is verified green against,
# and CI installs exactly this floor. Older releases are unsupported; at or below
# 0.3.170 the reader raises "compression method is not supported" on the example
# logs (0.3.171-0.3.179 are untested, hence not the floor).
dependencies = ["inspect_ai>=0.3.180"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "mypy>=1.11",
    "ruff>=0.6",
]

[project.scripts]
inspect-replay = "inspect_replay.cli:main"

[project.urls]
Homepage = "https://github.com/repowazdogz-droid/inspect-replay"
Repository = "https://github.com/repowazdogz-droid/inspect-replay"
Issues = "https://github.com/repowazdogz-droid/inspect-replay/issues"
Changelog = "https://github.com/repowazdogz-droid/inspect-replay/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/inspect_replay"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "ANN"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN"]
"examples/*" = ["ANN"]

[tool.mypy]
python_version = "3.11"
files = ["src/inspect_replay"]
strict = true
warn_unreachable = true
disallow_untyped_defs = true
no_implicit_reexport = false

[[tool.mypy.overrides]]
module = ["inspect_ai.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
