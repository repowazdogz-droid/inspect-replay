name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Ruff (lint)
        run: ruff check .

      - name: Ruff (format)
        run: ruff format --check .

      - name: Mypy
        run: mypy

      - name: Pytest
        run: pytest -v

      - name: Examples are reproducible from the committed generator
        # A .eval is a zip, and zip containers embed mtimes, so the BYTES move on
        # every regeneration even when the content is identical. Compare the
        # report the logs produce, which is the thing that must not drift.
        run: |
          inspect-replay compare examples/baseline.eval examples/sample-regression.eval --json > before.json || test $? -eq 1
          python examples/generate_examples.py
          inspect-replay compare examples/baseline.eval examples/sample-regression.eval --json > after.json || test $? -eq 1
          diff before.json after.json || {
            echo "::error::regenerating examples/ changed the report; the generator and the committed logs disagree"
            exit 1
          }
          git checkout -- examples/

      - name: README commands work exactly as documented
        run: |
          # exit 1 on differences
          inspect-replay compare examples/baseline.eval examples/sample-regression.eval && {
            echo "::error::expected exit code 1 when differences are found"
            exit 1
          }
          # exit 0 on identical logs
          inspect-replay compare examples/baseline.eval examples/baseline.eval
          # JSON parses and carries the CI-facing fields
          inspect-replay compare examples/baseline.eval examples/model-change.eval --json > out.json || test $? -eq 1
          python - <<'EOF'
          import json
          d = json.load(open("out.json"))
          assert d["schema_version"] == "1.0", d["schema_version"]
          assert d["sample_comparison_performed"] is True
          assert d["summary"]["newly_failing"] == 1, d["summary"]
          EOF

      - name: The README output block matches real output
        run: |
          inspect-replay compare examples/baseline.eval examples/sample-regression.eval > actual.txt || test $? -eq 1
          python - <<'EOF'
          import re, sys
          readme = open("README.md").read()
          block = re.search(r"```\n(Evaluation: .*?)```", readme, re.S).group(1)
          actual = open("actual.txt").read()
          if block.strip() != actual.strip():
              print("::error::README output block does not match real output")
              sys.exit(1)
          EOF

  build:
    name: Build and install the wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Build
        run: python -m pip install --upgrade pip build && python -m build

      - name: Install the wheel into a clean environment and run it
        run: |
          python -m venv /tmp/fresh
          /tmp/fresh/bin/pip install dist/*.whl
          /tmp/fresh/bin/inspect-replay --version
          /tmp/fresh/bin/inspect-replay compare examples/baseline.eval examples/model-change.eval --json > /dev/null || test $? -eq 1
